<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PedECG Challenge - Sign in</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="icon" type="image/png" href="images/favicon_ecg.png">

</head>
<body>
<div class="content-welcome">
<div class="card-welcome">
<h1>Pediatric ECG Adventure</h1>
<p id="greeting"></p>
<p>Welcome! Sign in or make a new account to get started. </p>
<button id="login-btn" class="btn">Log in with Google</button>
</div>
</div>
<script type="module">
import { auth, googleProvider } from "./js/firebase-config.js";
import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const greeting = document.getElementById("greeting");
const loginBtn = document.getElementById("login-btn");

loginBtn.addEventListener("click", () => {
  signInWithPopup(auth, googleProvider).catch((err) => console.error("Sign-in error:", err));
});

// As soon as we know who's signed in (whether from a fresh sign-in just
// now, or an already-active session), send them straight to the main
// menu - index.html is just the sign-in gate, not a destination.
onAuthStateChanged(auth, (user) => {
  if (user) {
    greeting.textContent = `Welcome, ${user.displayName || "player"}!`;
    loginBtn.style.display = "none";
    window.location.href = "mainmenu.html";
  }
});
</script>
</body>
</html>
